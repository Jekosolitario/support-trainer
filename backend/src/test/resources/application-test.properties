spring.datasource.url=jdbc:h2:mem:support_trainer_test;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.flyway.enabled=false

# Spring Session JDBC: never auto-init; H2 fixture is applied explicitly by
# SpringSessionH2SchemaAutoConfiguration from classpath:session/schema-h2-spring-session-4.0.2.sql.
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m

# Cookie di sessione per test/locale HTTP.
server.servlet.session.cookie.name=STSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.path=/

app.time.business-zone=Europe/Rome
app.time.clock-zone=UTC

app.email.mode=IN_MEMORY
app.email.verification-page-url=https://frontend.test/verify-email
app.email.password-recovery-page-url=https://frontend.test/reset-password
