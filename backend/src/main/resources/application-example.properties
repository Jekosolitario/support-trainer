spring.application.name=support_trainer

# Porta server predefinita
server.port=8080

# Obbligatoria: lista separata da virgole di origini frontend esatte (http/https, senza path)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# Tempo applicativo: orologio tecnico UTC e calendario business italiano
app.time.business-zone=${APP_TIME_BUSINESS_ZONE:Europe/Rome}
app.time.clock-zone=${APP_TIME_CLOCK_ZONE:UTC}

# Obbligatorie: configurazione database fornita dall'ambiente
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Gestione schema
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

# Log SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Obbligatoria: Base64 di almeno 32 byte casuali; nessun valore predefinito
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET}
# Numeri senza suffisso interpretati come millisecondi; sono ammessi anche 24h e 7d
app.security.jwt.expiration=${APP_SECURITY_JWT_EXPIRATION:86400000}
app.security.jwt.refresh-expiration=${APP_SECURITY_JWT_REFRESH_EXPIRATION:604800000}
