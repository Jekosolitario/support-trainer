spring.application.name=support_trainer

# Porta server predefinita
server.port=8080

# Tempo applicativo: orologio tecnico UTC e calendario business italiano
app.time.business-zone=${APP_TIME_BUSINESS_ZONE:Europe/Rome}
app.time.clock-zone=${APP_TIME_CLOCK_ZONE:UTC}

# Consegna verifica email: default locale sicuro senza rete.
app.email.mode=${APP_EMAIL_MODE:DISABLED}
# URL HTTPS obbligatorio per frontend remoto; HTTP ammesso soltanto in loopback locale.
app.email.verification-page-url=${APP_EMAIL_VERIFICATION_PAGE_URL:https://frontend.example/verify-email}
# Necessarie soltanto quando APP_EMAIL_MODE=SMTP; non inserire credenziali nel file.
app.email.sender.address=${APP_EMAIL_SENDER_ADDRESS:}
app.email.sender.name=${APP_EMAIL_SENDER_NAME:}
app.email.sender.reply-to=${APP_EMAIL_SENDER_REPLY_TO:}
app.email.smtp.host=${APP_EMAIL_SMTP_HOST:}
app.email.smtp.port=${APP_EMAIL_SMTP_PORT:587}
app.email.smtp.username=${APP_EMAIL_SMTP_USERNAME:}
app.email.smtp.password=${APP_EMAIL_SMTP_PASSWORD:}
app.email.smtp.auth=${APP_EMAIL_SMTP_AUTH:true}
app.email.smtp.start-tls=${APP_EMAIL_SMTP_START_TLS:true}
app.email.smtp.connect-timeout=${APP_EMAIL_SMTP_CONNECT_TIMEOUT:5s}
app.email.smtp.read-timeout=${APP_EMAIL_SMTP_READ_TIMEOUT:5s}
app.email.smtp.write-timeout=${APP_EMAIL_SMTP_WRITE_TIMEOUT:5s}

# Obbligatorie: configurazione database fornita dall'ambiente.
# SPRING_DATASOURCE_URL deve includere:
# jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?connectionTimeZone=%2B00:00&forceConnectionTimeZoneToSession=true
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Gestione schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

# Spring Session JDBC: schema ownership via Flyway V7 only.
# The former Boot 2 property for selecting the session store was removed in Spring Boot 3+;
# the JDBC starter selects the store without an explicit store-type setting.
# table-name and cleanup-cron keep Spring Session defaults (SPRING_SESSION, every minute).
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m

# Cookie di sessione server-side (produzione same-origin dietro reverse proxy).
# Non impostare Domain né Max-Age: cookie di sessione non persistente.
server.servlet.session.cookie.name=__Host-STSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.path=/

# Log SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
