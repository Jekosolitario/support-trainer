spring.application.name=support_trainer

# Porta server predefinita
server.port=8080

# Frontend autorizzati a chiamare le API nell'ambiente reale
app.cors.allowed-origins=https://tuodominio.it,https://www.tuodominio.it

spring.datasource.url=jdbc:mysql://localhost:3306/support_trainer
spring.datasource.username=USERNAME_DB
spring.datasource.password=PASSWORD_DB
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Gestione schema
spring.jpa.hibernate.ddl-auto=none

# Log SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.security.jwt.secret=INSERISCI_QUI_UNA_SECRET_BASE64_SICURA
# jwt.expiration=86400000 -> 1 giorno
app.security.jwt.expiration=86400000
# refresh-expiration=604800000 -> 7 giorni
app.security.jwt.refresh-expiration=604800000
