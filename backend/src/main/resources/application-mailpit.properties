spring.config.activate.on-profile=mailpit

# Profilo locale esplicito: non viene attivato automaticamente.
app.email.mode=SMTP
app.email.verification-page-url=http://localhost:5173/verify-email
app.email.sender.address=no-reply@support-trainer.local
app.email.sender.name=Support Trainer
app.email.smtp.host=localhost
app.email.smtp.port=1025
app.email.smtp.auth=false
app.email.smtp.start-tls=false
app.email.smtp.connect-timeout=5s
app.email.smtp.read-timeout=5s
app.email.smtp.write-timeout=5s

# Cookie di sessione per sviluppo HTTP locale.
# Sovrascrive i valori HTTPS/__Host- documentati in application-example.properties.
server.servlet.session.cookie.name=STSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.path=/
