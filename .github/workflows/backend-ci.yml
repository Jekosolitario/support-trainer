name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  verify-linux:
    name: Verify backend (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify Maven version
        run: |
          version_output="$(bash ./mvnw -version)"
          printf '%s\n' "$version_output"
          grep --fixed-strings --quiet 'Apache Maven 3.9.12' <<< "$version_output"

      - name: Build, test and package backend
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Verify packaged JAR
        run: test -f target/support_trainer-0.0.1-SNAPSHOT.jar

  verify-windows:
    name: Verify backend (Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify Maven version
        shell: pwsh
        run: |
          $versionOutput = .\mvnw.cmd -version | Out-String
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          Write-Host $versionOutput
          if ($versionOutput -notmatch 'Apache Maven 3\.9\.12') {
            throw 'Expected Apache Maven 3.9.12'
          }

      - name: Build, test and package backend
        shell: pwsh
        run: .\mvnw.cmd --batch-mode --no-transfer-progress clean verify

      - name: Verify packaged JAR
        shell: pwsh
        run: |
          if (-not (Test-Path 'target/support_trainer-0.0.1-SNAPSHOT.jar' -PathType Leaf)) {
            throw 'Packaged JAR not found'
          }

  certify-mysql-session-schema:
    name: Certify Spring Session MySQL schema
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: support_trainer_session_test_placeholder
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Certify Flyway V7 and Spring Session JDBC on MySQL
        env:
          MYSQL_PWD: test
        run: >
          bash ./mvnw --batch-mode --no-transfer-progress
          -Dit.mysql.enabled=true
          -Dit.mysql.empty-schema=support_trainer_session_test_empty
          -Dit.mysql.v6-schema=support_trainer_session_test_from_v6
          -Dtest=SpringSessionJdbcMySqlIntegrationTest
          test
